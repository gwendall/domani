name: Publish to npm

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Pin npm: OIDC trusted publishing needs >= 11.5.1, but npm@latest (12.0.0)
      # breaks provenance with "Cannot find module 'sigstore'", and node's bundled
      # 10.9 is too old for OIDC (publish 404s). 11.7.0 is the last 11.x - has both.
      - name: Pin npm
        run: npm install -g npm@11.7.0

      - run: npm install --include=dev

      - run: node build.mjs

      - name: Publish
        run: npm publish --access public --provenance
