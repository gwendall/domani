name: Publish to npm

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Use node 22's bundled npm (10.9.x): `npm install -g npm@latest` pulled an
      # npm whose provenance path fails with "Cannot find module 'sigstore'".

      - run: npm install --include=dev

      - run: node build.mjs

      - name: Publish
        run: npm publish --access public --provenance
